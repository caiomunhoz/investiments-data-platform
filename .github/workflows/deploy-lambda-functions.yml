name: Deploy Lambda Functions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-lambda-functions.yml
      - pyproject.toml
      - uv.lock
      - apps/lakehouse/ingestion/**
      - apps/lakehouse/lambda/**

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      functions: ${{ steps.changes.outputs.changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed functions
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            ingest-binance-trades:
              - .github/workflows/deploy-lambda-functions.yml
              - pyproject.toml
              - uv.lock
              - apps/lakehouse/ingestion/**
              - apps/lakehouse/lambda/Dockerfile
              - apps/lakehouse/lambda/ingest-binance-trades/**

  deploy:
    needs: changes
    if: needs.changes.outputs.functions != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        function: ${{ fromJSON(needs.changes.outputs.functions) }}
  
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ca-central-1
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN}} #TODO: change role

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Extract image metadata
        id: image-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/investments-data-platform/lambda-${{ matrix.function }}
          tags: |
            type=sha
            type=raw,value=latest
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: apps/lakehouse/lambda/Dockerfile
          build-args: |
            LAMBDA_FUNCTION_DIR=apps/lakehouse/lambda/${{ matrix.function }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-metadata.outputs.tags }}
          labels: ${{ steps.image-metadata.outputs.labels }}
          cache-from: type=gha,scope=lambda-${{ matrix.function }}
          cache-to: type=gha,mode=max,scope=lambda-${{ matrix.function }}