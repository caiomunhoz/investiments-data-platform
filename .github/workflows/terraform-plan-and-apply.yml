name: Terraform Plan and Apply

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/terraform-plan-and-apply.yml
      - infra/**
  workflow_call:
  workflow_dispatch:

concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    name: Check for Lambda Changes

    runs-on: ubuntu-latest

    outputs:
      skip: ${{ github.event_name == 'push' && steps.filter.outputs.lambda == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Detect Lambda changes
        uses: dorny/paths-filter@v4
        id: filter 
        with:
          filters: |
            lambda:
              - pyproject.toml
              - uv.lock
              - apps/lakehouse/ingestion/**
              - apps/lakehouse/lambda/**

  plan:
    name: Terraform Plan

    runs-on: ubuntu-latest

    needs: gate
    if: needs.gate.outputs.skip != 'true'
    
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ca-central-1
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: true

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: infra
        run: terraform plan -out=tfplan -detailed-exitcode
        continue-on-error: true

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == 1
        run: exit 1

      - name: Publish plan summary
        if: steps.plan.outputs.exitcode == 2
        working-directory: infra
        run: |
          {
            echo "### Terraform Plan"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == 2
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

  apply:
    name: Terraform Apply

    runs-on: ubuntu-latest

    needs: plan
    if: needs.plan.outputs.plan-exitcode == 2
    
    environment: terraform-apply

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ca-central-1
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: true

      - name: Download plan artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: infra

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan
